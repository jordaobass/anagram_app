# Análise estática (SonarQube). Rodar da raiz do repositório com o sonar-scanner,
# passando a versão do pubspec em -Dsonar.projectVersion para o "código novo" valer
# desde a versão anterior.
sonar.projectKey=anagram-app
sonar.projectName=Anagram App
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Build, dependências, arte de terceiros (fora do git) e binários não são código do projeto.
sonar.exclusions=**/build/**,**/.dart_tool/**,**/ephemeral/**,**/Pods/**,\
  **/GeneratedPluginRegistrant.*,mobile/assets/blocos_terceiros/**,\
  mobile/test/capturas/failures/**,**/*.png,**/*.ttf,.claude/**

# Cobertura: o SonarQube Community não analisa Dart, então os testes do app
# (flutter test) não entram na conta. O que sobra é o código nativo dos canais
# USB/MIDI, que só roda com a pedaleira plugada e é exercitado pela bancada
# (mobile/integration_test/bancada_test.dart), não por teste unitário. Sem esta
# exclusão, o portão mede 0% num código que não tem como ser coberto aqui.
sonar.coverage.exclusions=mobile/android/**,mobile/macos/**,mobile/ios/**,\
  mobile/apple_compartilhado/**,mobile/linux/**,mobile/windows/**,mobile/web/**,\
  mobile/ferramentas/**
