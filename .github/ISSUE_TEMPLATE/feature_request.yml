name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The problem you want to solve or the workflow you'd like to have.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
      description: Your idea. If it exists on the pedal's own screen, a photo of it is very helpful.
  - type: input
    id: firmware
    attributes:
      label: Anagram firmware (if relevant)
