name: anagram_app
description: "Editor de presets gratuito e open source para a pedaleira Darkglass Anagram, no estilo do HX Edit. Autor: jordao_bass."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3
  file_selector: ^1.0.3
  flutter_riverpod: ^3.0.0
  go_router: ^17.0.0
  logger: ^2.5.0
  web: ^1.1.0

dev_dependencies:
  build_runner: ^2.4.13
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  go_router_builder: ^4.0.0
  integration_test:
    sdk: flutter

flutter:
  # plugins nativos por Swift Package Manager: o Mac de build não tem CocoaPods
  config:
    enable-swift-package-manager: true
  uses-material-design: true
  assets:
    - assets/referencia/
    - assets/referencia/exemplos/
    - assets/blocos_terceiros/
    - assets/demonstracao/
  fonts:
    - family: Barlow
      fonts:
        - asset: assets/fontes/Barlow-Regular.ttf
        - asset: assets/fontes/Barlow-Medium.ttf
          weight: 500
        - asset: assets/fontes/Barlow-SemiBold.ttf
          weight: 600
    - family: BarlowCondensed
      fonts:
        - asset: assets/fontes/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fontes/BarlowCondensed-Bold.ttf
          weight: 700
    - family: SairaStencil
      fonts:
        - asset: assets/fontes/SairaStencilOne-Regular.ttf
    - family: PermanentMarker
      fonts:
        - asset: assets/fontes/PermanentMarker-Regular.ttf
